<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Room Booking</title>
</head>
<body>
     <article class="header">
        <img class="logo" src="images/uh-logo-large.png">
        <h1>Reserve a Study Room</h1>
    </article>

     <div class = "nav-menu">
        <button class = "menu-button">
            ☰ Navigation
        </button>
        <div class = "menu-links">
            <a href="homepage.html">Home</a>
            <a href="faq.html">FAQ</a>
            <a href="booking.html">Book a Room</a>
            <a href="reference.html">References</a>
        </div>
    </div>

    <p style="text-align: center; font-size: larger;" class="body-text">
        The student center at UH Sugar Land campus has five study rooms available for booking by students.<br>
        All tables have complementary gum stuck to the underside, and as a courtesy we've ensured that no outlets function!
    </p>

    <h2 class = "subheader">Booking Form</h2>

    <form method="post" style="font-family: 'Source Sans',sans-serif; padding-left: 20%;">
        <label for="room">Room</label>
        <br>
            <select id="room" name="room" required>
                <option value="">Select a Room</option>
                <option value="houston">Houston Room</option>
                <option value="dallas">Dallas Room</option>
                <option value="austin">Austin Room</option>
                <option value="san-antonio">San Antonio Room</option>
                <option value="el-paso">El Paso Room</option>
            </select>
        <br>
        <label for="date">Date</label>
        <br>
            <input type="date" id="date" name="date" required>
        <br>
        <label for="time">Time</label>
        <br>
            <input type="time" id="time" name="time" required>
        <br>
        <label for="name">Name</label>
        <br>
            <input type="name" id="name" name="name" required>
        <br>
        <label for="student-id">Student ID</label>
        <br>
            <input type="number" id="student-id"
    </form>

    <script src="script.js"></script>
</body>
</html>
